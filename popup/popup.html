<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tự động khảo sát</title>
  <link rel="stylesheet" href="../css/popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Tự động khảo sát</h1>
      <span class="version">v1.27</span>
    </header>

    <div class="status-section">
      <h3>📊 Trạng thái</h3>
      <div id="status" class="status-box">
        <p>Chưa kết nối với trang forms.office.com</p>
      </div>
    </div>

    <div class="progress-section" id="progressSection" style="display:none;">
      <h3>📈 Tiến độ</h3>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <p class="progress-text" id="progressText">0/0 mã môn học</p>
    </div>

    <div class="config-section">
      <h3 id="configToggle">
        ⚙️ Cấu hình 
        <span class="toggle-arrow">▼</span>
      </h3>
      
      <div class="config-content" id="configContent" style="display: none;">
        <div class="form-group">
          <label for="monHocValues">📝 Danh sách mã môn học:</label>
          <textarea id="monHocValues" placeholder="Nhập mã môn học, mỗi mã một dòng"></textarea>
        </div>

        <div class="form-group">
          <label for="nganh">Ngành:</label>
          <select id="nganh">
            <option value="Công nghệ Thông tin">Công nghệ Thông tin</option>
            <option value="Luật">Luật</option>
            <option value="Luật Kinh tế">Luật Kinh tế</option>
            <option value="Kế toán">Kế toán</option>
            <option value="Tài chính Ngân hàng">Tài chính Ngân hàng</option>
            <option value="Marketing">Marketing</option>
            <option value="Thương mại điện tử">Thương mại điện tử</option>
            <option value="Quản trị Kinh doanh">Quản trị Kinh doanh</option>
            <option value="Ngôn ngữ Anh">Ngôn ngữ Anh</option>
            <option value="Ngôn ngữ Nhật">Ngôn ngữ Nhật</option>
            <option value="Ngôn ngữ Trung Quốc">Ngôn ngữ Trung Quốc</option>
            <option value="Quản trị Dịch vụ du lịch và Lữ hành">Quản trị Dịch vụ du lịch và Lữ hành</option>
            <option value="Quản trị Khách sạn">Quản trị Khách sạn</option>
            <option value="Quản lý Bệnh viện">Quản lý Bệnh viện</option>
            <option value="Công nghệ Tài chính">Công nghệ Tài chính</option>
            <option value="Ngôn ngữ Hàn Quốc">Ngôn ngữ Hàn Quốc</option>
            <option value="Kỹ thuật Máy tính">Kỹ thuật Máy tính</option>
            <option value="Kinh tế Quốc tế">Kinh tế Quốc tế</option>
            <option value="Tâm Lý Học">Tâm Lý Học</option>
          </select>
        </div>

        <div class="form-group">
          <label for="tyLeThamGia">Tỷ lệ tham gia:</label>
          <select id="tyLeThamGia">
            <option value="<50%"><50%</option>
            <option value="50% - 70%">50% - 70%</option>
            <option value="70% - 90%">70% - 90%</option>
            <option value=">90 %">>90 %</option>
          </select>
        </div>

        <div class="form-group">
          <label for="danhGia">Đánh giá:</label>
          <select id="danhGia">
            <option value="Rất không hài lòng">Rất không hài lòng</option>
            <option value="Không hài lòng">Không hài lòng</option>
            <option value="Phân vân">Phân vân</option>
            <option value="Hài lòng">Hài lòng</option>
            <option value="Rất hài lòng">Rất hài lòng</option>
          </select>
        </div>

        <div class="form-group">
          <label for="textBox">Nội dung ô text:</label>
          <input type="text" id="textBox" placeholder="Nhập nội dung cho ô text">
        </div>

        <div class="button-group">
          <button id="saveConfigBtn" class="btn btn-secondary">
            <span class="icon">💾</span> Lưu cấu hình
          </button>
        </div>
      </div>
    </div>

    <div class="control-section">
      <h3>🎮 Điều khiển</h3>
      <button id="startBtn" class="btn btn-primary">
        <span class="icon">▶️</span> Bắt đầu tự động
      </button>
      <button id="stopBtn" class="btn btn-danger" disabled>
        <span class="icon">⏹️</span> Dừng lại
      </button>
      <button id="resetBtn" class="btn btn-warning">
        <span class="icon">🔄</span> Reset tiến trình
      </button>
    </div>

    <div class="info-section">
      <h3>ℹ️ Hướng dẫn</h3>
      <ul>
        <li>Mở trang forms.office.com với form khảo sát</li>
        <li>Click "Cấu hình" để thiết lập</li>
        <li>Click "Bắt đầu tự động" để chạy</li>
      </ul>
    </div>

    <footer>
      <div class="neon-container">
        <a href="https://www.facebook.com/hohuyhoang308/" target="_blank" class="neon-text">
          👨‍💻 Tác giả: Hồ Huy Hoàng
        </a>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
