<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Khảo Sát Học Phần</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            width: 300px;
        }
        h1 {
            font-size: 16px;
            text-align: center;
            margin-bottom: 10px;
            color: #007bff;
        }
        .form-group {
            margin-bottom: 10px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 13px;
        }
        select, input, textarea {
            width: 100%;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 12px;
        }
        textarea {
            height: 60px;
            resize: vertical;
        }
        button {
            width: 100%;
            padding: 8px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
        .neon-text {
            font-size: 0.8rem;
            color: black;
            text-align: center;
            margin-top: 10px;
            text-shadow: 0 0 5px #ff005e, 0 0 10px #ff005e;
            animation: glow 1.5s infinite alternate;
        }
        @keyframes glow {
            0% {
                text-shadow: 0 0 5px #ff005e, 0 0 10px #ff005e;
            }
            100% {
                text-shadow: 0 0 10px #00d4ff, 0 0 20px #00d4ff;
            }
        }
        
        /* Thông báo trực quan */
        #message {
            padding: 8px;
            margin: 5px 0 10px 0;
            border-radius: 3px;
            font-size: 12px;
            text-align: center;
            display: none;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <h1>Khảo Sát Học Phần - Cấu hình</h1>
    
    <!-- Thêm phần tử hiển thị thông báo -->
    <div id="message" class="success-message"></div>
    
    <div class="form-group">
        <label for="mon-hoc">Danh sách mã môn học:</label>
        <textarea id="mon-hoc" placeholder="Mỗi mã một dòng"></textarea>
    </div>
    <div class="form-group">
        <label for="nganh">Ngành:</label>
        <select id="nganh"></select>
    </div>
    <div class="form-group">
        <label for="ty-le">Tỷ lệ tham gia:</label>
        <select id="ty-le"></select>
    </div>
    <div class="form-group">
        <label for="danh-gia">Đánh giá:</label>
        <select id="danh-gia"></select>
    </div>
    <div class="form-group">
        <label for="text-box">Nội dung ô text:</label>
        <input type="text" id="text-box">
    </div>
    <button id="save-btn">Lưu cấu hình</button>
    <button id="start-btn">Bắt đầu</button>
    <button id="select-submit-btn">Chọn & Submit</button>
    <div class="neon-text">
        <a href="https://www.facebook.com/hohuyhoang308/" target="_blank">TÁC GIẢ: HỒ HUY HOÀNG</a>
    </div>
    <script src="popup.js"></script>
</body>
</html>
